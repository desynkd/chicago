# Publishes a GitHub release when a bare version tag is pushed.
#
# Obsidian's release tooling requires the tag to be the exact version from
# manifest.json with no "v" prefix, and it fetches main.js, manifest.json and
# styles.css as individual release assets — a zip will not be read.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Fails the release rather than shipping a build whose manifest version
      # disagrees with the tag someone pushed by hand.
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest.json version $manifest" >&2
            exit 1
          fi
          node -p "require('./versions.json')['$tag'] || (console.error('versions.json has no entry for $tag'), process.exit(1))"

      - run: npm run build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
